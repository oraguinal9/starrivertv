<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 电视直播 - 星河TV</title>
    <meta name="description" content="星河TV电视直播 - 免费在线观看CCTV、卫视、地方台等数百个电视频道">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="libs/hls.min.js"></script>
    <script src="js/proxy-auth.js"></script>
    <style>
        body { background: #0a0a0f; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .channel-card {
            background: #111; border: 1px solid #222; border-radius: 12px;
            padding: 16px; cursor: pointer; transition: all .2s;
        }
        .channel-card:hover { background: #1a1a1a; border-color: #e11d48; transform: translateY(-2px); }
        .channel-card.playing { border-color: #e11d48; background: #1a0a0f; }
        .tab-btn { padding: 8px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all .2s; }
        .tab-btn.active { background: #e11d48; color: #fff; }
        .tab-btn:not(.active) { background: #222; color: #999; }
        .tab-btn:not(.active):hover { background: #333; color: #ccc; }
        #player-container { background: #000; border-radius: 16px; overflow: hidden; }
        .channel-logo { width: 42px; height: 42px; border-radius: 10px; object-fit: contain; background: #18181f; flex-shrink: 0; }
        .channel-logo-placeholder { display: flex; align-items: center; justify-content: center; font-size: 20px; color: #666; }
        .hd-badge { display: inline-block; margin-left: 6px; padding: 1px 5px; font-size: 10px; line-height: 1.4; color: #fbbf24; background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.35); border-radius: 4px; vertical-align: 1px; }
    </style>
</head>
<body class="min-h-screen">

<div class="container mx-auto px-4 py-6 max-w-6xl">

    <!-- 头部 -->
    <header class="flex items-center justify-between mb-8 mt-4">
        <div class="flex items-center gap-4">
            <a href="/" class="text-3xl font-bold bg-gradient-to-r from-rose-400 via-red-500 to-pink-500 bg-clip-text text-transparent no-underline">星河TV</a>
            <span class="text-gray-500 text-lg">|</span>
            <span class="text-xl font-bold">📺 电视直播</span>
        </div>
        <a href="/" class="text-gray-400 hover:text-white transition-colors">← 返回搜索</a>
    </header>

    <!-- 播放器 -->
    <div id="player-container" class="mb-6 hidden">
        <div class="flex items-center justify-between p-3 bg-[#111] border-b border-gray-800">
            <span id="current-channel-name" class="font-medium"></span>
            <button onclick="closePlayer()" class="text-gray-400 hover:text-white px-3 py-1 rounded-lg hover:bg-[#333] transition-colors">✕ 关闭</button>
        </div>
        <video id="player" controls autoplay class="w-full aspect-video" style="max-height:60vh;"></video>
    </div>

    <!-- 搜索与统计 -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4">
        <div class="relative flex-1">
            <input id="search" type="text" placeholder="🔍 搜索频道（如：CCTV、湖南卫视）"
                class="w-full bg-[#111] border border-[#222] rounded-xl px-4 py-2.5 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-rose-500/60 transition-colors">
        </div>
        <div class="text-xs text-gray-500 whitespace-nowrap" id="live-stats"></div>
    </div>

    <!-- 标签切换（按频道分类动态生成） -->
    <div class="flex flex-wrap gap-3 mb-6" id="tabs"></div>

    <!-- 加载状态 -->
    <div id="loading" class="text-center py-20">
        <div class="text-gray-500 text-lg mb-2">正在加载频道列表...</div>
        <div class="text-gray-600 text-sm" id="loading-status"></div>
    </div>

    <!-- 频道列表 -->
    <div id="channel-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>

    <!-- 空状态 -->
    <div id="empty" class="text-center py-20 hidden">
        <div class="text-5xl mb-4">📡</div>
        <div class="text-gray-400">暂无频道数据</div>
        <button onclick="loadChannels()" class="mt-4 px-4 py-2 bg-[#222] hover:bg-[#333] text-gray-300 rounded-lg transition-colors">重新加载</button>
    </div>

</div>

<script>
let allChannels = [];
let currentTab = 'all';
let searchText = '';
let currentChannel = null;

// HLS.js 实例
let hls = null;

const CATEGORY_TABS = [
    { key: 'all', label: '全部' },
    { key: 'cctv', label: '📡 央视' },
    { key: 'weishi', label: '📺 卫视' },
    { key: 'difang', label: '🏙 地方' },
    { key: 'shuzi', label: '🔢 数字' },
    { key: 'other', label: '🌏 其他' },
];
const CATEGORY_LABEL = { cctv: '央视', weishi: '卫视', difang: '地方', shuzi: '数字', other: '其他' };

function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 当前标签 + 搜索词过滤后的频道列表
function getFiltered() {
    let list = allChannels;
    if (currentTab !== 'all') list = list.filter(c => c.category === currentTab);
    if (searchText) {
        const q = searchText.toLowerCase();
        list = list.filter(c => (c.name || '').toLowerCase().includes(q) || (c.group || '').toLowerCase().includes(q));
    }
    return list;
}

async function loadChannels() {
    const loading = document.getElementById('loading');
    const grid = document.getElementById('channel-grid');
    const status = document.getElementById('loading-status');

    loading.style.display = 'block';
    grid.innerHTML = '';
    status.textContent = '获取直播列表...';

    try {
        const resp = await fetch('/api/live');
        const data = await resp.json();
        allChannels = data.channels || [];
        updateStats(data);
        renderTabs();
        renderChannels();
        // 后台仍在抓取且列表为空时，稍后自动重试
        if (allChannels.length === 0 && (!data.status || data.status === 'loading')) {
            status.textContent = '正在抓取频道，稍候自动重试...';
            setTimeout(loadChannels, 4000);
            return;
        }
        status.textContent = '加载了 ' + allChannels.length + ' 个频道';
        setTimeout(() => { loading.style.display = 'none'; }, 300);
    } catch (e) {
        loading.style.display = 'none';
        document.getElementById('empty').classList.remove('hidden');
        console.error('加载频道失败:', e);
    }
}

function updateStats(data) {
    const el = document.getElementById('live-stats');
    if (!el) return;
    let text = '共 ' + (data.total || allChannels.length) + ' 个频道';
    if (data.validatedAt) {
        const d = new Date(data.validatedAt);
        text += ' · 验证于 ' + (d.getMonth() + 1) + '-' + d.getDate() + ' ' +
            String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    el.textContent = text;
}

// 按分类动态生成标签
function renderTabs() {
    const tabs = document.getElementById('tabs');
    if (!tabs) return;
    tabs.innerHTML = '';
    CATEGORY_TABS.forEach(t => {
        const count = t.key === 'all' ? allChannels.length : allChannels.filter(c => c.category === t.key).length;
        if (count === 0 && t.key !== 'all') return; // 没有频道的分类不显示
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (t.key === currentTab ? ' active' : '');
        btn.textContent = t.label + (count ? ' ' + count : '');
        btn.onclick = () => {
            currentTab = t.key;
            document.querySelectorAll('#tabs .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderChannels();
        };
        tabs.appendChild(btn);
    });
}

function renderChannels() {
    const grid = document.getElementById('channel-grid');
    const empty = document.getElementById('empty');

    const filtered = getFiltered();

    if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');

    grid.innerHTML = filtered.map((ch, i) => {
        const isPlaying = currentChannel && currentChannel.url === ch.url;
        const logoHtml = ch.logo
            ? '<img src="' + esc(ch.logo) + '" loading="lazy" referrerpolicy="no-referrer" class="channel-logo" onerror="this.style.display=\'none\'" alt="">'
            : '<div class="channel-logo channel-logo-placeholder">📺</div>';
        const hdHtml = ch.hd ? '<span class="hd-badge">高清</span>' : '';
        return '<div class="channel-card' + (isPlaying ? ' playing' : '') + '" onclick="playChannel(\'' + i + '\')">' +
            '<div class="flex items-center gap-2 mb-2">' + logoHtml + '<div class="min-w-0">' +
            '<div class="text-sm font-medium truncate">' + esc(ch.name || '未知频道') + hdHtml + '</div>' +
            '<div class="text-xs text-gray-500 truncate">' + esc(ch.group || CATEGORY_LABEL[ch.category] || '电视直播') + '</div>' +
            '</div></div></div>';
    }).join('');
}

async function playChannel(index) {
    const filtered = getFiltered();
    const ch = filtered[parseInt(index)];
    if (!ch) return;

    currentChannel = ch;
    document.getElementById('current-channel-name').textContent = '📺 ' + ch.name;
    document.getElementById('player-container').classList.remove('hidden');

    const video = document.getElementById('player');

    // 销毁旧 HLS 实例
    if (hls) { hls.destroy(); hls = null; }

    const url = ch.url;
    // HTTP 流通过服务器代理（解决 HTTPS 页面混合内容问题）
    let playUrl = url.startsWith('http://') ? '/play/' + encodeURIComponent(url) : url;
    // 代理流需要带鉴权参数（站点设置了 PASSWORD 时避免 401）
    if (playUrl.startsWith('/play/') && window.ProxyAuth && window.ProxyAuth.addAuthToProxyUrl) {
        playUrl = await window.ProxyAuth.addAuthToProxyUrl(playUrl);
    }
    if (url.endsWith('.m3u8') && Hls.isSupported()) {
        // HLS 播放
        hls = new Hls({ enableWorker: true, lowLatencyMode: false });
        hls.loadSource(playUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                console.warn('HLS error:', data.type);
                hls.destroy();
                hls = null;
                video.src = playUrl;
                video.play().catch(() => {});
            }
        });
    } else {
        // 直连播放
        video.src = playUrl;
        video.play().catch(() => {});
    }
    video.scrollIntoView({ behavior: 'smooth' });
    renderChannels();
}

function closePlayer() {
    const video = document.getElementById('player');
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
    currentChannel = null;
    document.getElementById('player-container').classList.add('hidden');
    renderChannels();
}

// 搜索过滤
document.getElementById('search').addEventListener('input', function(e) {
    searchText = e.target.value.trim();
    renderChannels();
});

// 页面加载
loadChannels();
</script>
